[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whynot-stadtnuke"
version = "2.0.0"
description = "Worldwide network census, attack-surface intelligence, and interactive visualization framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Abduallah Al Raju", email = "abdullahalraju33@gmail.com" }
]
keywords = [
  "network-census",
  "attack-surface",
  "shodan-internetdb",
  "cybersecurity",
  "osint",
  "port-scanner",
  "folium-mapping",
  "soc-telemetry"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Internet"
]
dependencies = [
  "requests>=2.28.0",
  "folium>=0.14.0",
  "fastapi>=0.95.0",
  "uvicorn>=0.20.0",
  "pydantic>=1.10.0"
]

[project.optional-dependencies]
test = [
  "pytest>=7.0.0"
]

[project.scripts]
stadtnuke = "stadtnuke:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
