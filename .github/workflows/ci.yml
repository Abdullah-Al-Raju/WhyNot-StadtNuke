name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run Pytest Suite
        run: |
          pytest -v tests/

      - name: Test Offline Demo Census & Map Generation
        run: |
          python stadtnuke.py demo --city "Munich" --output munich_test.json --map-output munich_test.html
          test -f munich_test.json
          test -f munich_test.html
